# ──────────────────────────────────────────────────────────────────
# Pen Times Magazine — Production Docker Compose
#
# Key differences from development:
#   - DB and Redis ports NOT exposed to host (internal only)
#   - restart: always instead of unless-stopped
#   - Multi-stage production image targets used
#   - Structured JSON log rotation configured
#   - Redis password required
#   - Migrations run inside the API container CMD before server start
#   - Optimized health checks for faster recovery
# ──────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine3.20
    container_name: pentimes_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - pentimes_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7.2.5-alpine3.20
    container_name: pentimes_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pentimes_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: pentimes_api_prod
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: 4000
      # Number of reverse proxies in front of the API (Nginx = 1, Cloudflare + Nginx = 2)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "4000"
    # Loopback only: lets you run `curl http://localhost:4000/health` on the
    # server without exposing the API to the internet (nginx is the public entry)
    ports:
      - "127.0.0.1:4000:4000"
    # Start in parallel with postgres/redis — API retries internally
    depends_on:
      - postgres
      - redis
    networks:
      - pentimes_network_prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Reduced from 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Web ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        # Inlined into the browser bundle at build time, so this must be the
        # PUBLIC URL browsers use (https://pentimes.ng via nginx), never http://api:4000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-${CLOUDINARY_CLOUD_NAME}}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set}
    container_name: pentimes_web_prod
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}  # Added for runtime
   # Loopback only: the public entry point is nginx, not this port
    ports:
      - "127.0.0.1:3000:3000"
    # No depends_on – Next.js can start independently
    networks:
      - pentimes_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  # Requires Let's Encrypt certs on the host (see DEPLOYMENT.md §5)
  nginx:
    image: nginx:1.27.0-alpine3.19
    container_name: pentimes_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - pentimes_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
# ── Named Volumes ────────────────────────────────────────────────
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  pentimes_network_prod:
    driver: bridge
    name: pentimes_network_prod