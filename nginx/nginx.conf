# ──────────────────────────────────────────────────────────────────
# Pen Times Magazine — Nginx reverse proxy
#
# One public origin (https://pentimes.ng):
#   /graphql, /upload, /health  →  api:4000
#   everything else             →  web:3000
#
# Nginx is the ONLY proxy in front of the API, so the API must run with
# TRUST_PROXY=1. If you put Cloudflare in front of this, use TRUST_PROXY=2.
# ──────────────────────────────────────────────────────────────────

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Page-request limiter. Server-rendered pages skip the API's own rate limit
  # (see INTERNAL_API_KEY), so this is what stops one IP from hammering pages.
  # Generous because many mobile users share one IP (carrier-grade NAT).
  limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;
  limit_req_status 429;

  # Docker's internal DNS; lets nginx start even if a container is restarting
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Lets Next.js upgrade connections when the client asks for it
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── HTTP → HTTPS ────────────────────────────────────────────────
  server {
    listen 80;
    server_name pentimes.ng www.pentimes.ng;

    return 301 https://pentimes.ng$request_uri;
  }

  # ── www → apex (single canonical origin avoids CORS surprises) ──
  server {
    listen 443 ssl;
    http2 on;
    server_name www.pentimes.ng;

    ssl_certificate     /etc/letsencrypt/live/pentimes.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pentimes.ng/privkey.pem;

    return 301 https://pentimes.ng$request_uri;
  }

  # ── Main site ───────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name pentimes.ng;

    ssl_certificate     /etc/letsencrypt/live/pentimes.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pentimes.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static build assets: fingerprinted files, not rate limited
    location /_next/static/ {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Key    "";   # never accept this header from the internet
    }

    # Frontend (Next.js) pages
    location / {
      limit_req zone=pages burst=60 nodelay;
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Key    "";   # never accept this header from the internet
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # GraphQL API
    location /graphql {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Key    "";   # never accept this header from the internet
    }

    # Image uploads (base64 payloads — API accepts up to 10mb JSON)
    location /upload {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      client_max_body_size 15m;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Key    "";   # never accept this header from the internet
    }

    # Health check (for uptime monitors)
    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Key    "";   # never accept this header from the internet
    }
  }
}